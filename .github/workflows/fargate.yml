on:
  workflow_dispatch:
  push:

env:
  ecscluster: fargatewebapp
  awsaccountid: 965667556928
  awsregion: us-east-1
  awsvpcsubnet: subnet-0d9e179f467e08c15

jobs:
  fargate:
    runs-on: ubuntu-latest
    steps:
    - name: Cloning project source code
      uses: actions/checkout@v2
    - name: Installing PowerShell Modules for AWS
      shell: pwsh
      run: |
        Install-Module -Name AWS.Tools.ECS, AWS.Tools.ECR -Force
    - name: Configure AWS Credentials for China region audience
      uses: aws-actions/configure-aws-credentials@v5.1.0
      with:
        aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-region: us-east-1
    - name: Login to ECR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.awsaccountid }}.dkr.ecr.${{ env.awsregion }}.amazonaws.com
        username: ${{ secrets.AWS_ACCESS_KEY_ID }}
        password: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    - name: Create ECR
      continue-on-error: true
      shell: pwsh
      run: |
        New-ECRRepository -RepositoryName ${{ env.ecscluster }}
    - name: Create Amazon ECS Cluster
      continue-on-error: true
      shell: pwsh
      run: |
        New-ECSCluster -ClusterName ${{ env.ecscluster }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v2
      with:
        push: true
        tags: ${{ env.awsaccountid }}.dkr.ecr.${{ env.awsregion }}.amazonaws.com/${{ env.ecscluster }}:latest          
    - name: Create Amazon ECS Fargate Task
      shell: pwsh
      run: |
        New-ECSTask -Cluster ${{ env.ecscluster }} -AwsvpcConfiguration_AssignPublicIp ENABLED -AwsvpcConfiguration_Subnet ${{ env.awsvpcsubnet }} -LaunchType FARGATE -TaskDefinition todowebapp
